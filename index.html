<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苏中区域看板 · 入口</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,#0F2C56 0%,#1E4E8C 55%,#2C6BB8 100%); min-height:100vh;
  display:flex; align-items:center; justify-content:center; padding:24px; color:#0F2C56; }
.card { background:#fff; border-radius:18px; padding:34px 36px; width:100%; max-width:420px;
  box-shadow:0 18px 50px rgba(9,30,66,.35); }
.logo { text-align:center; font-size:30px; margin-bottom:8px; }
h1 { font-size:20px; text-align:center; color:#0F2C56; margin-bottom:6px; }
.sub { text-align:center; font-size:13px; color:#64748B; margin-bottom:22px; }
.field { margin-bottom:14px; }
label { display:block; font-size:13px; color:#475569; margin-bottom:6px; }
input { width:100%; padding:11px 13px; border:1px solid #CBD5E1; border-radius:10px;
  font-size:15px; outline:none; transition:.15s; background:#F8FAFC; }
input:focus { border-color:#4F88C9; background:#fff; box-shadow:0 0 0 3px rgba(79,136,201,.18); }
.btn { width:100%; padding:12px; border:none; border-radius:10px; background:#4F88C9; color:#fff;
  font-size:15px; font-weight:600; cursor:pointer; margin-top:4px; }
.btn:hover { background:#3A6FB0; }
.err { color:#DC2626; font-size:13px; text-align:center; min-height:18px; margin-top:10px; }
.tips { font-size:11.5px; color:#94A3B8; text-align:center; margin-top:18px; line-height:1.7; }
.links { display:none; }
.links.on { display:block; }
.link { display:flex; align-items:center; justify-content:space-between; padding:13px 16px;
  border:1px solid #E2E8F0; border-radius:12px; margin-bottom:9px; text-decoration:none; color:#0F2C56;
  background:#F8FAFC; transition:.15s; }
.link:hover { background:#EFF6FF; border-color:#4F88C9; }
.link .t { font-weight:600; font-size:14.5px; }
.link .d { font-size:12px; color:#64748B; margin-top:2px; }
.link .g { color:#4F88C9; font-size:18px; }
.head2 { font-size:15px; color:#0F2C56; margin:18px 0 10px; padding-bottom:8px; border-bottom:1px solid #E2E8F0; }
.logout { text-align:center; margin-top:18px; font-size:12.5px; color:#94A3B8; cursor:pointer; }
.logout:hover { color:#4F88C9; text-decoration:underline; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🧱</div>
  <h1>苏中区域看板</h1>
  <div class="sub">请输入口令进入</div>
  <div id="gate">
    <div class="field">
      <label for="pwd">访问口令</label>
      <input id="pwd" type="password" placeholder="向店长或管理员索取" autocomplete="current-password" autofocus>
    </div>
    <button class="btn" id="btn">进入</button>
    <div class="err" id="err"></div>
    <div class="tips">口令由店长配置，请勿外传给非授权人员。<br>忘记口令请联系管理员重置。</div>
  </div>
  <div class="links" id="links">
    <div class="head2">📊 日常看板</div>
    <a class="link" href="./" target="_blank"><div><div class="t">苏中区域日销看板</div><div class="d">7店日KPI · 长尾 · 导购 · 渠道</div></div><span class="g">›</span></a>
    <a class="link" href="./dashboard_latest.html" target="_blank"><div><div class="t">日看板完整版（桌面端）</div><div class="d">含模块一栏全部明细</div></div><span class="g">›</span></a>
    <a class="link" href="./dashboard_latest_mobile.html" target="_blank"><div><div class="t">日看板移动端</div><div class="d">手机适配版</div></div><span class="g">›</span></a>
    <div class="head2">📈 周月维度分析</div>
    <a class="link" href="./weekly_analysis.html" target="_blank"><div><div class="t">周维度交互分析</div><div class="d">7店 × 区域 · KPI + 9张图表</div></div><span class="g">›</span></a>
    <a class="link" href="./monthly_analysis.html" target="_blank"><div><div class="t">月度交互分析</div><div class="d">累计/同比/产品/导购</div></div><span class="g">›</span></a>
    <div class="head2">🌕 专题</div>
    <a class="link" href="./midautumn_2026.html" target="_blank"><div><div class="t">中秋假期总结（9/25–27）</div><div class="d">门店 + 导购 + 渠道 + 长尾</div></div><span class="g">›</span></a>
    <div class="logout" id="logout">退出登录</div>
  </div>
</div>
<script>
const EXPECTED_SHA = '896df9d1b7fe';
const EXPECTED_MD5 = '8c8e77be';
const STORAGE_KEY = 'suzhong_auth_ok';

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,12);
}
async function md5Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('m_'+str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,8);
}

function showLinks() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('links').classList.add('on');
}

async function tryAuth() {
  const v = document.getElementById('pwd').value;
  const err = document.getElementById('err');
  err.textContent = '';
  if (!v) { err.textContent = '请输入口令'; return; }
  const s = await sha256Hex(v);
  const m = await md5Hex(v);
  if (s === EXPECTED_SHA && m === EXPECTED_MD5) {
    sessionStorage.setItem(STORAGE_KEY, '1');
    showLinks();
  } else {
    err.textContent = '口令错误，请向店长或管理员索取';
  }
}

document.getElementById('btn').addEventListener('click', tryAuth);
document.getElementById('pwd').addEventListener('keydown', e => { if (e.key === 'Enter') tryAuth(); });
document.getElementById('logout').addEventListener('click', () => {
  sessionStorage.removeItem(STORAGE_KEY); location.reload();
});

if (sessionStorage.getItem(STORAGE_KEY) === '1') showLinks();
</script>
</body>
</html>
