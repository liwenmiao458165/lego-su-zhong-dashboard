.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-grid.full{grid-template-columns:1fr}
.chart-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border)}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-card h3 .icon{font-size:18px}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:380px}
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th{background:#f1f5f9;padding:10px 12px;text-align:center;font-weight:700;border-bottom:2px solid var(--border)}
.summary-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)}
.summary-table tr:hover{background:#f8fafc}
.summary-table .store-name{text-align:left;font-weight:600}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.gray{background:#f1f5f9;color:#64748b}
.conclusion{font-size:13px;color:#475569;margin-top:10px;padding:0;background:#f8fafc;border-radius:6px;border-left:3px solid var(--purple);line-height:1.5;overflow:hidden}
.conc-title{padding:8px 12px 4px 12px;font-weight:700;color:#1e293b}
.conc-body{padding:0 12px 8px 12px}
.conc-opportunity{padding:6px 12px;background:#fef3c7;border-top:1px solid #f59e0b;font-size:12px;color:#92400e;line-height:1.6}
.conc-opportunity .conc-label{font-weight:700;color:#b45309}
.footer{text-align:center;padding:30px;color:var(--text-muted);font-size:12px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-grid{grid-template-columns:1fr}}

  charts.cmpRegProducts=new Chart(document.getElementById('cmpRegProducts'),{
    type:'bar',
    data:{labels:rpEnts.map(([k])=>k),datasets:[{label:'月销售',data:rpEnts.map(([k,a,q])=>a),backgroundColor:SC.slice(0,rpEnts.length).map(c=>c+'cc'),borderColor:SC.slice(0,rpEnts.length),borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const idx=ctx.dataIndex;const [n,a,q]=rpEnts[idx];const pct=totAmt>0?(a/totAmt*100).toFixed(1):0;return n+': '+fmtAmt(a)+' ('+pct+'%, '+q+'件)'}}}},
      scales:{x:{ticks:{callback:v=>fmtAmt(v)}}}}
  });

  // Chart: 门店月成交率
  charts.cmpConv=new Chart(document.getElementById('cmpConv'),{
    type:'bar',
    data:{labels:convData.map(x=>x.s),datasets:[{label:'月成交率',data:convData.map(x=>x.v),backgroundColor:convData.map(x=>STORE_COLORS[x.s]+'cc'),borderColor:convData.map(x=>STORE_COLORS[x.s]),borderWidth:1,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const x=convData[ctx.dataIndex];return '月成交率: '+x.v.toFixed(2)+'% | 笔数'+x.cnt+' / 客流'+x.flow;}}}},
      scales:{y:{ticks:{callback:v=>v+'%'}}}}
  });

  // Summary table
  let tHtml='<thead><tr><th>门店</th><th>月累计</th><th>月目标</th><th>月完成率</th><th>月同比</th><th>月环比</th><th>笔数</th><th>客单价</th><th>连带率</th><th>成交率</th><th>WOS</th><th>即时零售</th><th>长尾款</th><th>长尾件数</th><th>长尾占比</th><th>样品</th><th>样品件数</th></tr></thead><tbody>';
  // 区域均值（区域汇总表低于均值标红）
  const regMonthAmtAvg=totAmt/STORE_ORDER.length;
  const regMonthCntAvg=totCnt/STORE_ORDER.length;
  const regMonthATV=r.month_atv;
  const regMonthJD=r.month_jd;
  const regMonthLtPctAvg=STORE_ORDER.reduce((a,s)=>a+(DATA[s].month_amt>0?(DATA[s].month_lt/DATA[s].month_amt*100):0),0)/STORE_ORDER.length;
  STORE_ORDER.forEach(s=>{
    const d=DATA[s];
    const lpct=d.month_amt>0?(d.month_lt/d.month_amt*100):0;
    const sd=((DATA['_sample']||{})[s])||{};
    const yb=isNA(d.yoy)?'<span class="badge gray">N/A</span>':(d.yoy>=0?'<span class="badge green">+'+d.yoy.toFixed(1)+'%</span>':'<span class="badge red">'+d.yoy.toFixed(1)+'%</span>');
    const mb=isNA(d.mom)?'<span class="badge gray">N/A</span>':(d.mom>=0?'<span class="badge green">+'+d.mom.toFixed(1)+'%</span>':'<span class="badge red">'+d.mom.toFixed(1)+'%</span>');
    tHtml+='<tr><td class="store-name" style="color:'+STORE_COLORS[s]+'">'+s+'</td><td style="font-weight:700'+(d.month_amt<regMonthAmtAvg?';color:#dc2626':'')+'">'+fmtAmt(d.month_amt)+'</td><td>'+fmtAmt(d.target)+'</td><td style="color:'+(d.month_rate>=50?'#16a34a':'#dc2626')+';font-weight:700">'+d.month_rate.toFixed(1)+'%</td><td>'+yb+'</td><td>'+mb+'</td><td'+(d.month_cnt<regMonthCntAvg?' style="color:#dc2626;font-weight:700"':'')+'>'+d.month_cnt+'</td><td'+(d.month_atv<regMonthATV?' style="color:#dc2626;font-weight:700"':'')+'>¥'+Math.round(d.month_atv)+'</td><td'+(d.month_jd<regMonthJD?' style="color:#dc2626;font-weight:700"':'')+'>'+d.month_jd.toFixed(2)+'</td><td style="color:'+((cvo[s]&&cvo[s].rate>=rConv.rate)?'#16a34a':'#dc2626')+';font-weight:700">'+((cvo[s]&&cvo[s].rate)?cvo[s].rate.toFixed(2):'N/A')+'%</td><td>'+fmtAmt(d.month_wos)+'</td><td>'+fmtAmt(d.month_jl)+'</td><td>'+fmtAmt(d.month_lt)+'</td><td>'+(d.month_lt_qty||0)+'件</td><td style="color:'+(lpct<regMonthLtPctAvg?'#dc2626':'#16a34a')+';font-weight:700">'+lpct.toFixed(1)+'%</td><td style="color:#9333ea">'+fmtAmt(sd.month_amt||0)+'</td><td>'+(sd.month_qty||0)+'件</td></tr>';
  });
  tHtml+='<tr style="background:#7c3aed10;font-weight:700"><td class="store-name">区域合计</td><td>'+fmtAmt(totAmt)+'</td><td>'+fmtAmt(totTarget)+'</td><td style="color:'+(totRate>=50?'#16a34a':'#dc2626')+'">'+totRate.toFixed(1)+'%</td><td>'+(isNA(r.yoy)?'<span class="badge gray">N/A</span>':(r.yoy>=0?'<span class="badge green">+'+r.yoy.toFixed(1)+'%</span>':'<span class="badge red">'+r.yoy.toFixed(1)+'%</span>'))+'</td><td>'+(isNA(r.mom)?'<span class="badge gray">N/A</span>':(r.mom>=0?'<span class="badge green">+'+r.mom.toFixed(1)+'%</span>':'<span class="badge red">'+r.mom.toFixed(1)+'%</span>'))+'</td><td>'+totCnt+'</td><td>¥'+Math.round(r.month_atv)+'</td><td>'+r.month_jd.toFixed(2)+'</td><td style="color:#16a34a;font-weight:700">'+(rConv.rate?rConv.rate.toFixed(2):'N/A')+'%</td><td>'+fmtAmt(totWos)+'</td><td>'+fmtAmt(totJl)+'</td><td>'+fmtAmt(totLt)+'</td><td>'+totLtQty+'件</td><td style="color:'+(totAmt>0&&(totLt/totAmt*100)>=10?'#16a34a':'#dc2626')+';font-weight:700">'+(totAmt>0?(totLt/totAmt*100).toFixed(1):0)+'%</td><td style="color:#9333ea">'+fmtAmt(sReg.month_amt||0)+'</td><td>'+(sReg.month_qty||0)+'件</td></tr>';
  tHtml+='</tbody>';
  document.getElementById('cmpTable').innerHTML=tHtml;
  // 区域均值标红说明
  let cmpNote=document.getElementById('cmpTableNote');
  if(cmpNote) cmpNote.remove();
  cmpNote=document.createElement('div');
  cmpNote.id='cmpTableNote';
  cmpNote.style='margin-top:10px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:13px;color:#dc2626;font-weight:700';
  cmpNote.textContent='🔴 月累计/笔数/客单价/连带率/长尾占比 低于区域均值已标红（月累计¥'+Math.round(regMonthAmtAvg)+'、笔数'+Math.round(regMonthCntAvg)+'、客单价¥'+Math.round(regMonthATV)+'、连带率'+regMonthJD.toFixed(2)+'、长尾占比'+regMonthLtPctAvg.toFixed(1)+'%）';
  document.getElementById('cmpTable').parentNode.appendChild(cmpNote);
  let _cmpConc=document.createElement('div');
  _cmpConc.style.cssText='margin-top:10px';
  const _below=STORE_ORDER.filter(s=>DATA[s].month_amt<regMonthAmtAvg);
  const _dual=STORE_ORDER.filter(s=>!isNA(DATA[s].yoy)&&DATA[s].yoy<0&&!isNA(DATA[s].mom)&&DATA[s].mom<0);
  const _topRate=STORE_ORDER.map(s=>({s,rate:DATA[s].month_rate})).sort((a,b)=>b.rate-a.rate)[0];
  _cmpConc.innerHTML=conc('区域7店中'+_below.length+'家月累计低于区域均值（¥'+Math.round(regMonthAmtAvg)+'）：'+(_below.length?_below.map(s=>s).join('、')+'。':'均超均值。')+_topRate.s+'完成率领先（'+_topRate.rate.toFixed(1)+'%）。',(_dual.length>0?(_dual.map(s=>s).join('、')+'同环比双降，是区域主要拖累，建议集中资源帮扶并复盘品类与客流。'):(_below.length===0?'各门店月累计与同环比表现均衡，区域整体健康。':'')));
  document.getElementById('cmpTable').parentNode.appendChild(_cmpConc);

  // All guides ranking chart — sorted by completion rate
  const allGuides=[];
  STORE_ORDER.forEach(s=>{((DATA['_guides']||{})[s]||[]).forEach(g=>allGuides.push(g));});
  allGuides.sort((a,b)=>b.m_rate-a.m_rate);
  if(allGuides.length>0){
    charts.cmpGuides=new Chart(document.getElementById('cmpGuides'),{
      type:'bar',
      data:{labels:allGuides.map(g=>g.name+'('+g.store+') '+g.m_rate.toFixed(1)+'%'),datasets:[{label:'月度完成率(%)',data:allGuides.map(g=>g.m_rate),backgroundColor:allGuides.map(g=>g.m_rate>=50?STORE_COLORS[g.store]+'cc':'#dc2626cc'),borderColor:allGuides.map(g=>g.m_rate>=50?STORE_COLORS[g.store]:'#dc2626'),borderWidth:1,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const g=allGuides[ctx.dataIndex];return g.name+'('+g.store+'): 完成率'+g.m_rate.toFixed(1)+'% | 月销售'+fmtAmt(g.m_sales)+' | 月目标'+fmtAmt(g.target)+' | 月环比'+(isNA(g.mom)?'N/A':(g.mom>=0?'+':'')+g.mom.toFixed(1)+'%')}}}},
        scales:{x:{title:{display:true,text:'完成率(%)'},ticks:{callback:v=>v+'%'}}}}
    });
  }
}

function selectStore(store){
  currentStore=store;
  document.querySelectorAll('.store-tab').forEach(t=>t.classList.toggle('active',t.dataset.store===store));
  if(store==='区域对比'){renderComparison();}
  else{renderStore(store);}
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
  selectStore(currentStore);
});
</script>
</body>
</html>
