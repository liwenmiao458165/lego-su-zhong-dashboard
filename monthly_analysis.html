*{margin:0;padding:0;box-sizing:border-box}

.kpi-card{background:var(--card-bg);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border);text-align:center}
.kpi-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.kpi-card .value{font-size:24px;font-weight:800}
.kpi-card .sub{font-size:11px;margin-top:4px}
.kpi-card .value.red{color:var(--red)}.kpi-card .value.green{color:var(--green)}.kpi-card .value.blue{color:var(--blue)}.kpi-card .value.orange{color:var(--orange)}.kpi-card .value.purple{color:var(--purple)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-grid.full{grid-template-columns:1fr}
.chart-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border)}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-card h3 .icon{font-size:18px}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:380px}
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th{background:#f1f5f9;padding:10px 12px;text-align:center;font-weight:700;border-bottom:2px solid var(--border)}
.summary-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)}
.summary-table tr:hover{background:#f8fafc}
#cmpTable.summary-table{table-layout:fixed;width:100%;font-size:12px}
#cmpTable.summary-table th,
#cmpTable.summary-table td{padding:6px 4px;white-space:normal}
#cmpTable.summary-table th:first-child,
#cmpTable.summary-table .store-name{width:100px;min-width:100px;padding:6px 6px;text-align:left;font-weight:600;white-space:normal}
#cmpTable.summary-table th{width:52px;min-width:52px}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.gray{background:#f1f5f9;color:#64748b}
.conclusion{font-size:13px;color:#475569;margin-top:10px;padding:0;background:#f8fafc;border-radius:6px;border-left:3px solid var(--purple);line-height:1.5;overflow:hidden}
.conc-title{padding:8px 12px 4px 12px;font-weight:700;color:#1e293b}
.conc-body{padding:0 12px 8px 12px}
.conc-opportunity{padding:6px 12px;background:#fef3c7;border-top:1px solid #f59e0b;font-size:12px;color:#92400e;line-height:1.6}
.conc-opportunity .conc-label{font-weight:700;color:#b45309}
.footer{text-align:center;padding:30px;color:var(--text-muted);font-size:12px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-grid{grid-template-columns:1fr}}

'<td style="color:#9333ea">'+fmtAmt(sReg.month_amt||0)+'</td><td>'+(sReg.month_qty||0)+'件</td></tr>';
  tHtml+='</tbody>';
  document.getElementById('cmpTable').innerHTML=tHtml;
  // 区域均值标红说明
  let cmpNote=document.getElementById('cmpTableNote');
  if(cmpNote) cmpNote.remove();
  cmpNote=document.createElement('div');
  cmpNote.id='cmpTableNote';
  cmpNote.style='margin-top:10px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:13px;color:#dc2626;font-weight:700';
  cmpNote.textContent='🔴 月累计/笔数/客单价/连带率 低于区域均值已标红（月累计¥'+Math.round(regMonthAmtAvg)+'、笔数'+Math.round(regMonthCntAvg)+'、客单价¥'+Math.round(regMonthATV)+'、连带率'+regMonthJD.toFixed(2)+'）｜秋季特惠/明星同款：参考区域均值｜长尾完成率 = 长尾款 ÷（销售指标×'+LTR_LABEL+'）';
  document.getElementById('cmpTable').parentNode.appendChild(cmpNote);
  let _cmpConc=document.createElement('div');
  _cmpConc.style.cssText='margin-top:10px';
  const _below=STORE_ORDER.filter(s=>DATA[s].month_amt<regMonthAmtAvg);
  const _dual=STORE_ORDER.filter(s=>!isNA(DATA[s].yoy)&&DATA[s].yoy<0&&!isNA(DATA[s].mom)&&DATA[s].mom<0);
  const _topRate=STORE_ORDER.map(s=>({s,rate:DATA[s].month_rate})).sort((a,b)=>b.rate-a.rate)[0];
  _cmpConc.innerHTML=conc('区域7店中'+_below.length+'家月累计低于区域均值（¥'+Math.round(regMonthAmtAvg)+'）：'+(_below.length?_below.map(s=>s).join('、')+'。':'均超均值。')+_topRate.s+'完成率领先（'+_topRate.rate.toFixed(1)+'%）。',(_dual.length>0?(_dual.map(s=>s).join('、')+'同环比双降，是区域主要拖累，建议集中资源帮扶并复盘品类与客流。'):(_below.length===0?'各门店月累计与同环比表现均衡，区域整体健康。':'')));
  document.getElementById('cmpTable').parentNode.appendChild(_cmpConc);

  // All guides ranking chart — sorted by completion rate
  const allGuides=[];
  STORE_ORDER.forEach(s=>{((DATA['_guides']||{})[s]||[]).forEach(g=>allGuides.push(g));});
  allGuides.sort((a,b)=>b.m_rate-a.m_rate);
  if(allGuides.length>0){
    charts.cmpGuides=new Chart(document.getElementById('cmpGuides'),{
      type:'bar',
      data:{labels:allGuides.map(g=>g.name+'('+g.store+') '+g.m_rate.toFixed(1)+'%'),datasets:[{label:'月度完成率(%)',data:allGuides.map(g=>g.m_rate),backgroundColor:allGuides.map(g=>g.m_rate>=50?STORE_COLORS[g.store]+'cc':'#dc2626cc'),borderColor:allGuides.map(g=>g.m_rate>=50?STORE_COLORS[g.store]:'#dc2626'),borderWidth:1,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const g=allGuides[ctx.dataIndex];return g.name+'('+g.store+'): 完成率'+g.m_rate.toFixed(1)+'% | 月销售'+fmtAmt(g.m_sales)+' | 月目标'+fmtAmt(g.target)+' | 月环比'+(isNA(g.mom)?'N/A':(g.mom>=0?'+':'')+g.mom.toFixed(1)+'%')}}}},
        scales:{x:{title:{display:true,text:'完成率(%)'},ticks:{callback:v=>v+'%'}}}}
    });
  }
}

function selectStore(store){
  currentStore=store;
  document.querySelectorAll('.store-tab').forEach(t=>t.classList.toggle('active',t.dataset.store===store));
  if(store==='区域对比'){renderComparison();}
  else{renderStore(store);}
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
  selectStore(currentStore);
});
</script>
</body>
</html>
