.kpi-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px}

.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-grid.full{grid-template-columns:1fr}
.chart-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border)}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-card h3 .icon{font-size:18px}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:380px}
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th{background:#f1f5f9;padding:10px 12px;text-align:center;font-weight:700;border-bottom:2px solid var(--border)}
.summary-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)}
.summary-table tr:hover{background:#f8fafc}
.summary-table .store-name{text-align:left;font-weight:600}
.summary-table .pos{color:var(--green);font-weight:700}.summary-table .neg{color:var(--red);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.gray{background:#f1f5f9;color:#64748b}
.conclusion{font-size:13px;color:#475569;margin-top:10px;padding:0;background:#f8fafc;border-radius:6px;border-left:3px solid var(--purple);line-height:1.5;overflow:hidden}
.conc-title{padding:8px 12px 4px 12px;font-weight:700;color:#1e293b}
.conc-body{padding:0 12px 8px 12px}
.conc-opportunity{padding:6px 12px;background:#fef3c7;border-top:1px solid #f59e0b;font-size:12px;color:#92400e;line-height:1.6}
.conc-opportunity .conc-label{font-weight:700;color:#b45309}
.footer{text-align:center;padding:30px;color:var(--text-muted);font-size:12px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-grid{grid-template-columns:1fr}}

  // Chart 7: Regional TOP10 products
  const rp=(DATA['_products']||{})['_region']||{};
  const rpEnts=Object.entries(rp).map(([k,v])=>[k,v.amt||v,v.qty||0]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  charts.cmpRegProducts=new Chart(document.getElementById('cmpRegProducts'),{
    type:'bar',
    data:{labels:rpEnts.map(([k])=>k),datasets:[{label:'\u5468\u9500\u552e',data:rpEnts.map(([k,a,q])=>a),backgroundColor:SC.slice(0,rpEnts.length).map(c=>c+'cc'),borderColor:SC.slice(0,rpEnts.length),borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const idx=ctx.dataIndex;const [n,a,q]=rpEnts[idx];const pct=totAmt>0?(a/totAmt*100).toFixed(1):0;return n+': '+fmtAmt(a)+' ('+pct+'%, '+q+'\u4ef6)'}}}},
      scales:{x:{ticks:{callback:v=>fmtAmt(v)}}}}
  });

  // Chart: 门店WK38周成交率
  charts.cmpConv=new Chart(document.getElementById('cmpConv'),{
    type:'bar',
    data:{labels:convData.map(x=>x.s),datasets:[{label:'周成交率',data:convData.map(x=>x.v),backgroundColor:convData.map(x=>STORE_COLORS[x.s]+'cc'),borderColor:convData.map(x=>STORE_COLORS[x.s]),borderWidth:1,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const x=convData[ctx.dataIndex];return '周成交率: '+(x.v===null?'缺客流':x.v.toFixed(2)+'%')+' | 笔数'+x.cnt+' / 客流'+x.flow;}}}},
      scales:{y:{ticks:{callback:v=>v+'%'}}}}
  });

  // Summary table
  let tHtml='<thead><tr><th>\u95e8\u5e97</th><th>\u5468\u7d2f\u8ba1</th><th>\u5468\u73af\u6bd4</th><th>\u5468\u540c\u6bd4</th><th>\u7b14\u6570</th><th>\u5ba2\u5355\u4ef7</th><th>\u8fde\u5e26\u7387</th><th>周成交率</th><th>WOS</th><th>\u5373\u65f6\u96f6\u552e</th><th>\u957f\u5c3e\u6b3e</th><th>\u957f\u5c3e\u4ef6\u6570</th><th>\u6837\u54c1</th><th>\u6837\u54c1\u4ef6\u6570</th><th>\u957f\u5c3e\u5360\u6bd4</th><th>\u957f\u5c3e\u5b8c\u6210\u7387</th><th>\u65b0\u54c1\u5468\u7d2f\u8ba1</th><th>\u65b0\u54c1\u5360\u6bd4</th></tr></thead><tbody>';
  // 区域均值（区域汇总表低于均值标红）
  const regWkAmtAvg=totAmt/STORE_ORDER.length;
  const regWkCntAvg=totCnt/STORE_ORDER.length;
  const regWkATV=getRegWkATV();
  const regWkJD=getRegWkJD();
  const regWkLtPctAvg=STORE_ORDER.reduce((a,s)=>a+(DATA[s].wk_amt>0?(DATA[s].wk_lt/DATA[s].wk_amt*100):0),0)/STORE_ORDER.length;
  STORE_ORDER.forEach(s=>{
    const d=DATA[s];const atv=getWeeklyATV(s),jd=getWeeklyJD(s),cnt=getWeeklyCnt(s);
    const lpct=d.wk_amt>0?(d.wk_lt/d.wk_amt*100):0;
    const ltQ=d.daily.reduce((a,x)=>a+(x.lt_qty||0),0);
    const sampD=(DATA['_sample']||{})[s]||{};
    const npAmt=d.wk_np_amt||0;const npPct=d.wk_amt>0?npAmt/d.wk_amt*100:0;
    const wb=isNA(d.wow)?'<span class="badge gray">N/A</span>':(d.wow>=0?'<span class="badge green">+'+d.wow.toFixed(1)+'%</span>':'<span class="badge red">'+d.wow.toFixed(1)+'%</span>');
    const yb=isNA(d.wk_yoy)?'<span class="badge gray">N/A</span>':(d.wk_yoy>=0?'<span class="badge green">+'+d.wk_yoy.toFixed(1)+'%</span>':'<span class="badge red">'+d.wk_yoy.toFixed(1)+'%</span>');
    tHtml+='<tr><td class="store-name" style="color:'+STORE_COLORS[s]+'">'+s+'</td><td style="font-weight:700'+(d.wk_amt<regWkAmtAvg?';color:#dc2626':'')+'">'+fmtAmt(d.wk_amt)+'</td><td>'+wb+'</td><td>'+yb+'</td><td'+(cnt<regWkCntAvg?' style="color:#dc2626;font-weight:700"':'')+'>'+cnt+'</td><td'+(atv<regWkATV?' style="color:#dc2626;font-weight:700"':'')+'>¥'+Math.round(atv)+'</td><td'+(jd<regWkJD?' style="color:#dc2626;font-weight:700"':'')+'>'+jd.toFixed(2)+'</td><td style="color:'+((wcvo[s]&&wcvo[s].flow>0&&wcvo[s].rate>=rConv.rate)?'#16a34a':'#dc2626')+';font-weight:700">'+((wcvo[s]&&wcvo[s].flow>0)?wcvo[s].rate.toFixed(2)+'%':'缺客流')+'</td><td>'+fmtAmt(d.wk_wos)+'</td><td>'+fmtAmt(d.wk_jl)+'</td><td>'+fmtAmt(d.wk_lt)+'</td><td>'+ltQ+'\u4ef6</td><td'+(sampD.wk_amt>0?'':' style="color:#dc2626;font-weight:700"')+'>'+fmtAmt(sampD.wk_amt||0)+(sampD.wk_amt>0?'':'｜未开单')+'</td><td>'+(sampD.wk_qty||0)+'\u4ef6</td><td style="color:'+(lpct<regWkLtPctAvg?'#dc2626':'#16a34a')+';font-weight:700">'+lpct.toFixed(1)+'%</td><td style="color:'+((d.wk_lt_target||0)>0?(((d.wk_lt/d.wk_lt_target*100)>=100)?'#16a34a':'#dc2626'):'#94a3b8')+';font-weight:700">'+((d.wk_lt_target||0)>0?(d.wk_lt/d.wk_lt_target*100).toFixed(1)+'%':'—')+'</td><td>'+fmtAmt(npAmt)+'</td><td style="color:'+(npPct<20?'#dc2626':'#16a34a')+';font-weight:700">'+npPct.toFixed(1)+'%</td></tr>';
  });
  // Totals row
  tHtml+='<tr style="background:#7c3aed10;font-weight:700"><td class="store-name">\u533a\u57df\u5408\u8ba1</td><td>'+fmtAmt(totAmt)+'</td><td>'+(isNA(r.wow)?'<span class="badge gray">N/A</span>':(r.wow>=0?'<span class="badge green">+'+r.wow.toFixed(1)+'%</span>':'<span class="badge red">'+r.wow.toFixed(1)+'%</span>'))+'</td><td>'+(isNA(regYoy)?'<span class="badge gray">N/A</span>':(regYoy>=0?'<span class="badge green">+'+regYoy.toFixed(1)+'%</span>':'<span class="badge red">'+regYoy.toFixed(1)+'%</span>'))+'</td><td>'+totCnt+'</td><td>\u00a5'+Math.round(getRegWkATV())+'</td><td>'+getRegWkJD().toFixed(2)+'</td><td style="color:#16a34a;font-weight:700">'+(rConv.rate===null?'N/A':rConv.rate.toFixed(2)+'%')+'%</td><td>'+fmtAmt(totWos)+'</td><td>'+fmtAmt(totJl)+'</td><td>'+fmtAmt(totLt)+'</td><td>'+totLtQty+'\u4ef6</td><td>'+fmtAmt(sReg.wk_amt||0)+'</td><td>'+(sReg.wk_qty||0)+'\u4ef6</td><td style="color:'+(totAmt>0&&(totLt/totAmt*100)>=10?'#16a34a':'#dc2626')+'">'+(totAmt>0?(totLt/totAmt*100).toFixed(1):0)+'%</td><td style="color:'+(totLtRate===null?'#94a3b8':(totLtRate>=100?'#16a34a':'#dc2626'))+';font-weight:700">'+(totLtRate===null?'—':totLtRate.toFixed(1)+'%')+'</td><td>'+fmtAmt(npRegAmt)+'</td><td style="color:'+(totAmt>0&&(npRegAmt/totAmt*100)>=20?'#16a34a':'#dc2626')+';font-weight:700">'+(totAmt>0?(npRegAmt/totAmt*100).toFixed(1):0)+'%</td></tr>';
  tHtml+='</tbody>';
  document.getElementById('cmpTable').innerHTML=tHtml;
  // 区域均值标红说明
  let cmpNote=document.getElementById('cmpTableNote');
  if(cmpNote) cmpNote.remove();
  cmpNote=document.createElement('div');
  cmpNote.id='cmpTableNote';
  cmpNote.style='margin-top:10px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:13px;color:#dc2626;font-weight:700';
  cmpNote.textContent='🔴 周累计/笔数/客单价/连带率/长尾占比 低于区域均值已标红（周累计¥'+Math.round(regWkAmtAvg)+'、笔数'+Math.round(regWkCntAvg)+'、客单价¥'+Math.round(regWkATV)+'、连带率'+regWkJD.toFixed(2)+'、长尾占比'+regWkLtPctAvg.toFixed(1)+'%；新品占比<20%标红；样品未开单标红；长尾完成率 = 长尾款 ÷（销售指标×'+LTR_LABEL+'）';
  document.getElementById('cmpTable').parentNode.appendChild(cmpNote);
  let _cmpConc=document.createElement('div');
  _cmpConc.style.cssText='margin-top:10px';
  const _below=STORE_ORDER.filter(s=>DATA[s].wk_amt<regWkAmtAvg);
  const _dual=STORE_ORDER.filter(s=>!isNA(DATA[s].wk_yoy)&&DATA[s].wk_yoy<0&&!isNA(DATA[s].wow)&&DATA[s].wow<0);
  const _topRate=STORE_ORDER.map(s=>{const d=DATA[s];const wt=d.daily.reduce((a,x)=>a+(x.target||0),0);return{s,rate:wt>0?d.wk_amt/wt*100:0};}).sort((a,b)=>b.rate-a.rate)[0];
  _cmpConc.innerHTML=conc('区域7店中'+_below.length+'家周累计低于区域均值（¥'+Math.round(regWkAmtAvg)+'）：'+(_below.length?_below.map(s=>s).join('、')+'。':'均超均值。')+_topRate.s+'完成率领先（'+_topRate.rate.toFixed(1)+'%）。',(_dual.length>0?(_dual.map(s=>s).join('、')+'同环比双降，是区域主要拖累，建议集中资源帮扶并复盘品类与客流。'):(_below.length===0?'各门店周累计与同环比表现均衡，区域整体健康。':'')));
  document.getElementById('cmpTable').parentNode.appendChild(_cmpConc);

  // All guides ranking chart (bar=周销售 + line=周环比)
  const allGuides=[];
  STORE_ORDER.forEach(s=>{((DATA['_guides']||{})[s]||[]).forEach(g=>allGuides.push(g));});
  allGuides.sort((a,b)=>b.wk_sales-a.wk_sales);
  if(allGuides.length>0){
    charts.cmpGuides=new Chart(document.getElementById('cmpGuides'),{
      data:{labels:allGuides.map(g=>g.name+'('+g.store+')'),datasets:[
        {type:'bar',label:'\u5468\u9500\u552e',data:allGuides.map(g=>g.wk_sales),backgroundColor:allGuides.map(g=>STORE_COLORS[g.store]+'cc'),borderColor:allGuides.map(g=>STORE_COLORS[g.store]),borderWidth:1,borderRadius:4,xAxisID:'x'},
        {type:'line',label:'\u5468\u73af\u6bd4',data:allGuides.map(g=>isNA(g.wow)?null:g.wow),borderColor:'#dc2626',backgroundColor:'transparent',borderWidth:2,pointRadius:5,pointBackgroundColor:allGuides.map(g=>isNA(g.wow)?'#94a3b8':(g.wow>=0?'#16a34a':'#dc2626')),tension:.3,xAxisID:'x1'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>{const g=allGuides[ctx.dataIndex];if(ctx.dataset.label.includes('\u5468\u9500'))return '\u5468\u9500\u552e: '+fmtAmt(g.wk_sales);return '\u5468\u73af\u6bd4: '+(isNA(g.wow)?'N/A':(g.wow>=0?'+':'')+g.wow.toFixed(1)+'%');}}}},
        scales:{x:{position:'bottom',title:{display:true,text:'\u5468\u9500\u552e(\u00a5)'},ticks:{callback:v=>fmtAmt(v)}},x1:{position:'top',title:{display:true,text:'\u5468\u73af\u6bd4(%)'},grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'}}}}
    });
  }
}

function selectStore(store){
  currentStore=store;
  document.querySelectorAll('.store-tab').forEach(t=>t.classList.toggle('active',t.dataset.store===store));
  if(store==='\u533a\u57df\u5bf9\u6bd4'){renderComparison();}
  else{renderStore(store);}
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
  selectStore(currentStore);
});
</script>
</body>
</html>
