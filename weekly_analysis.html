.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--card-bg);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border);text-align:center}
.kpi-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.kpi-card .value{font-size:24px;font-weight:800}
.kpi-card .sub{font-size:11px;margin-top:4px}
.kpi-card .value.red{color:var(--red)}.kpi-card .value.green{color:var(--green)}.kpi-card .value.blue{color:var(--blue)}.kpi-card .value.orange{color:var(--orange)}.kpi-card .value.purple{color:var(--purple)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-grid.full{grid-template-columns:1fr}
.chart-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border)}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-card h3 .icon{font-size:18px}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:380px}
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th{background:#f1f5f9;padding:10px 12px;text-align:center;font-weight:700;border-bottom:2px solid var(--border)}
.summary-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)}
.summary-table tr:hover{background:#f8fafc}
.summary-table .store-name{text-align:left;font-weight:600}
.summary-table .pos{color:var(--green);font-weight:700}.summary-table .neg{color:var(--red);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.gray{background:#f1f5f9;color:#64748b}
.conclusion{font-size:13px;color:#475569;margin-top:10px;padding:0;background:#f8fafc;border-radius:6px;border-left:3px solid var(--purple);line-height:1.5;overflow:hidden}
.conc-title{padding:8px 12px 4px 12px;font-weight:700;color:#1e293b}
.conc-body{padding:0 12px 8px 12px}
.conc-opportunity{padding:6px 12px;background:#fef3c7;border-top:1px solid #f59e0b;font-size:12px;color:#92400e;line-height:1.6}
.conc-opportunity .conc-label{font-weight:700;color:#b45309}
.footer{text-align:center;padding:30px;color:var(--text-muted);font-size:12px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-grid{grid-template-columns:1fr}}

function concTop(s){
  const d=DATA[s];const pd=(DATA['_products']||{})[s]||{};
  const ents=Object.entries(pd).map(([k,v])=>[k,v.amt||v,v.qty||0]).sort((a,b)=>b[1]-a[1]);
  if(ents.length===0)return conc('暂无产品数据。');
  const [n,a,q]=ents[0];const pct=d.wk_amt>0?a/d.wk_amt*100:0;
  const c='TOP1产品「'+n+'」销售'+fmtAmt(a)+'（'+q+'件），占周销售'+pct.toFixed(1)+'%。';
  let o='';if(pct>25)o='TOP1单品依赖度过高（>25%），警惕库存不足和缺货风险，建议培养第二梯队爆款。';
  // check 当月新品是否进入TOP10
  const newProds=DATA['_new_products']||[];
  if(newProds.length>0){
    const top10Names=ents.slice(0,10).map(([k])=>k);
    const newInTop=newProds.filter(np=>top10Names.some(tn=>tn.includes(np)||np.includes(tn)));
    if(newInTop.length>0)o+='当月新品「'+newInTop.join('、')+'」进入TOP10，表现突出，建议加大陈列和推荐力度。';
    else o+='当月新品无一款进入TOP10，需关注新品陈列位置和推荐话术，加强新品首周曝光。';
  }
  // check 区域TOP10产品门店是否也在TOP10
  const rpd=(DATA['_products']||{})['_region']||{};
  const rEnts=Object.entries(rpd).map(([k,v])=>[k,v.amt||v,v.qty||0]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const storeTop10=new Set(ents.slice(0,10).map(([k])=>k));
  const rInStore=rEnts.filter(([k])=>storeTop10.has(k));
  const rNotInStore=rEnts.filter(([k])=>!storeTop10.has(k));
  if(rInStore.length>0)o+='区域TOP10中'+rInStore.length+'款门店也有在TOP10（'+rInStore.map(([k])=>k).join('、')+'）';
  if(rNotInStore.length>0)o+=(rInStore.length>0?'，':'')+'区域TOP10中'+rNotInStore.length+'款门店未进入TOP10（'+rNotInStore.map(([k])=>k).join('、')+'），建议对齐区域爆款推荐策略。';
  else if(rInStore.length===10)o+='门店TOP10与区域完全重合，产品结构高度一致。';
  return conc(c,o);
}
function concGuideSales(s){

  const c='TOP1导购'+top.name+'周销售'+fmtAmt(top.wk_sales)+'（完成率'+top.wk_rate.toFixed(1)+'%），门店导购合计'+fmtAmt(tot)+'。';
  let o='';const stAvg=gs.length>0?tot/gs.length:0;
  const allRegGuides=[];STORE_ORDER.forEach(t=>{(DATA['_guides']||{})[t]?.forEach(g=>allRegGuides.push(g));});
  const regAvg=allRegGuides.length>0?allRegGuides.reduce((a,g)=>a+g.wk_sales,0)/allRegGuides.length:0;
  const topPct=tot>0?top.wk_sales/tot*100:0;if(topPct>50)o='TOP导购销售占门店'+topPct.toFixed(0)+'%，建议头部经验分享复制，缩小导购间差距。';
  const belowSt=gs.filter(g=>g.wk_sales>0&&g.wk_sales<stAvg*0.7);
  if(belowSt.length>0)o+=belowSt.map(g=>g.name+'('+fmtAmt(g.wk_sales)+')').join('、')+'低于门店均值'+fmtAmt(stAvg)+'，需重点跟进销售技巧辅导。';
  const belowReg=gs.filter(g=>g.wk_sales>0&&g.wk_sales<regAvg*0.7);
  if(belowReg.length>0)o+=belowReg.map(g=>g.name).join('、')+'低于区域导购均值'+fmtAmt(regAvg)+'，建议安排导师带教和排班优化。';
  const low=gs.filter(g=>g.wk_rate<30&&g.wk_sales>0);if(low.length>0)o+=low.length+'位导购完成率不足30%，需一对一辅导。';

  return conc(c,o);
}

function concGuideLt(s){

    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>{if(ctx.dataset.label.includes('\u5ba2\u5355'))return '\u5ba2\u5355\u4ef7: \u00a5'+Math.round(ctx.raw);return '\u8fde\u5e26\u7387: '+ctx.raw.toFixed(2)}}}},
      scales:{y:{position:'left',title:{display:true,text:'\u5ba2\u5355\u4ef7(\u00a5)'},ticks:{callback:v=>'\u00a5'+v}},y1:{position:'right',title:{display:true,text:'\u8fde\u5e26\u7387'},grid:{drawOnChartArea:false},ticks:{callback:v=>v.toFixed(1)}}}}
  });

  // Chart 4: WoW
  const wowData=STORE_ORDER.map(s=>({s,v:DATA[s].wow}));
  charts.cmpWow=new Chart(document.getElementById('cmpWow'),{
    type:'bar',
    data:{labels:wowData.map(x=>x.s),datasets:[
      {label:'WK30',data:wowData.map(x=>DATA[x.s].wk28_amt||0),backgroundColor:'#94a3b880',borderColor:'#64748b',borderWidth:1,borderRadius:4},
      {label:'WK31',data:wowData.map(x=>DATA[x.s].wk_amt||0),backgroundColor:wowData.map(x=>STORE_COLORS[x.s]+'cc'),borderColor:wowData.map(x=>STORE_COLORS[x.s]),borderWidth:1,borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+fmtAmt(ctx.raw)}}},
      scales:{y:{ticks:{callback:v=>fmtAmt(v)}}}}
  });

  // Chart 5: WOS & JL comparison
  charts.cmpWosJl=new Chart(document.getElementById('cmpWosJl'),{
    type:'bar',
    data:{labels:STORE_ORDER,datasets:[
      {label:'WOS',data:STORE_ORDER.map(s=>DATA[s].wk_wos),backgroundColor:'#0284c7cc',borderColor:'#0284c7',borderWidth:1,borderRadius:4},
      {label:'\u5373\u65f6\u96f6\u552e',data:STORE_ORDER.map(s=>DATA[s].wk_jl),backgroundColor:'#ea580ccc',borderColor:'#ea580c',borderWidth:1,borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+fmtAmt(ctx.raw)}}},
      scales:{y:{ticks:{callback:v=>fmtAmt(v)}}}}
  });

  // Chart: Combined long-tail & sample comparison
  charts.cmpLtSample=new Chart(document.getElementById('cmpLtSample'),{
    type:'bar',
    data:{labels:ltSampleData.map(x=>x.s),datasets:[
      {label:'\u957f\u5c3e\u6b3e',data:ltSampleData.map(x=>x.ltAmt),backgroundColor:'#ea580ccc',borderColor:'#ea580c',borderWidth:1,borderRadius:4},
      {label:'\u6837\u54c1',data:ltSampleData.map(x=>x.sampAmt),backgroundColor:'#9333eacc',borderColor:'#9333ea',borderWidth:1,borderRadius:4}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>{const x=ltSampleData[ctx.dataIndex];if(ctx.datasetIndex===0)return '\u957f\u5c3e\u6b3e: '+fmtAmt(x.ltAmt)+' ('+x.ltQty+'\u4ef6, \u5360\u6bd4'+x.ltPct.toFixed(1)+'%)';return '\u6837\u54c1: '+fmtAmt(x.sampAmt)+' ('+x.sampQty+'\u4ef6)';}}}},
      scales:{y:{ticks:{callback:v=>fmtAmt(v)}}}}
  });

  // Chart 6: Regional series doughnut
  const rs=(DATA['_series']||{})['_region']||{};
  const rse=Object.entries(rs).sort((a,b)=>b[1]-a[1]);
  const rtop10=rse.slice(0,10),roth=rse.slice(10).reduce((a,[,v])=>a+v,0);
  charts.cmpRegSeries=new Chart(document.getElementById('cmpRegSeries'),{
    type:'doughnut',
    data:{labels:rtop10.map(([k])=>k).concat(roth>0?['\u5176\u4ed6']:[]),datasets:[{data:rtop10.map(([,v])=>v).concat(roth>0?[roth]:[]),backgroundColor:SC.slice(0,rtop10.length+(roth>0?1:0)),borderWidth:2,borderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11},padding:6}},tooltip:{callbacks:{label:ctx=>{const pct=totAmt>0?(ctx.raw/totAmt*100).toFixed(1):0;return ctx.label+': '+fmtAmt(ctx.raw)+' ('+pct+'%)'}}}},cutout:'55%'}
  });

  // Chart 7: Regional TOP10 products
  const rp=(DATA['_products']||{})['_region']||{};
  const rpEnts=Object.entries(rp).map(([k,v])=>[k,v.amt||v,v.qty||0]).sort((a,b)=>b[1]-a[1]).slice(0,10);
  charts.cmpRegProducts=new Chart(document.getElementById('cmpRegProducts'),{
    type:'bar',
    data:{labels:rpEnts.map(([k])=>k),datasets:[{label:'\u5468\u9500\u552e',data:rpEnts.map(([k,a,q])=>a),backgroundColor:SC.slice(0,rpEnts.length).map(c=>c+'cc'),borderColor:SC.slice(0,rpEnts.length),borderWidth:1,borderRadius:4}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const idx=ctx.dataIndex;const [n,a,q]=rpEnts[idx];const pct=totAmt>0?(a/totAmt*100).toFixed(1):0;return n+': '+fmtAmt(a)+' ('+pct+'%, '+q+'\u4ef6)'}}}},
      scales:{x:{ticks:{callback:v=>fmtAmt(v)}}}}
  });

  // Chart: 门店WK31周成交率
  charts.cmpConv=new Chart(document.getElementById('cmpConv'),{
    type:'bar',
    data:{labels:convData.map(x=>x.s),datasets:[{label:'周成交率',data:convData.map(x=>x.v),backgroundColor:convData.map(x=>STORE_COLORS[x.s]+'cc'),borderColor:convData.map(x=>STORE_COLORS[x.s]),borderWidth:1,borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>{const x=convData[ctx.dataIndex];return '周成交率: '+x.v.toFixed(2)+'% | 笔数'+x.cnt+' / 客流'+x.flow;}}}},
      scales:{y:{ticks:{callback:v=>v+'%'}}}}
  });

  // Summary table
  let tHtml='<thead><tr><th>\u95e8\u5e97</th><th>\u5468\u7d2f\u8ba1</th><th>\u5468\u73af\u6bd4</th><th>\u5468\u540c\u6bd4</th><th>\u7b14\u6570</th><th>\u5ba2\u5355\u4ef7</th><th>\u8fde\u5e26\u7387</th><th>周成交率</th><th>WOS</th><th>\u5373\u65f6\u96f6\u552e</th><th>\u957f\u5c3e\u6b3e</th><th>\u957f\u5c3e\u4ef6\u6570</th><th>\u6837\u54c1</th><th>\u6837\u54c1\u4ef6\u6570</th><th>\u957f\u5c3e\u5360\u6bd4</th></tr></thead><tbody>';
  // 区域均值（区域汇总表低于均值标红）
  const regWkAmtAvg=totAmt/STORE_ORDER.length;
  const regWkCntAvg=totCnt/STORE_ORDER.length;
  const regWkATV=getRegWkATV();
  const regWkJD=getRegWkJD();
  const regWkLtPctAvg=STORE_ORDER.reduce((a,s)=>a+(DATA[s].wk_amt>0?(DATA[s].wk_lt/DATA[s].wk_amt*100):0),0)/STORE_ORDER.length;
  STORE_ORDER.forEach(s=>{
    const d=DATA[s];const atv=getWeeklyATV(s),jd=getWeeklyJD(s),cnt=getWeeklyCnt(s);
    const lpct=d.wk_amt>0?(d.wk_lt/d.wk_amt*100):0;
    const ltQ=d.daily.reduce((a,x)=>a+(x.lt_qty||0),0);
    const sampD=(DATA['_sample']||{})[s]||{};
    const wb=isNA(d.wow)?'<span class="badge gray">N/A</span>':(d.wow>=0?'<span class="badge green">+'+d.wow.toFixed(1)+'%</span>':'<span class="badge red">'+d.wow.toFixed(1)+'%</span>');
    const yb=isNA(d.wk_yoy)?'<span class="badge gray">N/A</span>':(d.wk_yoy>=0?'<span class="badge green">+'+d.wk_yoy.toFixed(1)+'%</span>':'<span class="badge red">'+d.wk_yoy.toFixed(1)+'%</span>');
    tHtml+='<tr><td class="store-name" style="color:'+STORE_COLORS[s]+'">'+s+'</td><td style="font-weight:700'+(d.wk_amt<regWkAmtAvg?';color:#dc2626':'')+'">'+fmtAmt(d.wk_amt)+'</td><td>'+wb+'</td><td>'+yb+'</td><td'+(cnt<regWkCntAvg?' style="color:#dc2626;font-weight:700"':'')+'>'+cnt+'</td><td'+(atv<regWkATV?' style="color:#dc2626;font-weight:700"':'')+'>¥'+Math.round(atv)+'</td><td'+(jd<regWkJD?' style="color:#dc2626;font-weight:700"':'')+'>'+jd.toFixed(2)+'</td><td style="color:'+((wcvo[s]&&wcvo[s].rate>=rConv.rate)?'#16a34a':'#dc2626')+';font-weight:700">'+((wcvo[s]&&wcvo[s].rate)?wcvo[s].rate.toFixed(2):'N/A')+'%</td><td>'+fmtAmt(d.wk_wos)+'</td><td>'+fmtAmt(d.wk_jl)+'</td><td>'+fmtAmt(d.wk_lt)+'</td><td>'+ltQ+'\u4ef6</td><td>'+fmtAmt(sampD.wk_amt||0)+'</td><td>'+(sampD.wk_qty||0)+'\u4ef6</td><td style="color:'+(lpct<regWkLtPctAvg?'#dc2626':'#16a34a')+';font-weight:700">'+lpct.toFixed(1)+'%</td></tr>';
  });
  // Totals row
  tHtml+='<tr style="background:#7c3aed10;font-weight:700"><td class="store-name">\u533a\u57df\u5408\u8ba1</td><td>'+fmtAmt(totAmt)+'</td><td>'+(isNA(r.wow)?'<span class="badge gray">N/A</span>':(r.wow>=0?'<span class="badge green">+'+r.wow.toFixed(1)+'%</span>':'<span class="badge red">'+r.wow.toFixed(1)+'%</span>'))+'</td><td>'+(isNA(regYoy)?'<span class="badge gray">N/A</span>':(regYoy>=0?'<span class="badge green">+'+regYoy.toFixed(1)+'%</span>':'<span class="badge red">'+regYoy.toFixed(1)+'%</span>'))+'</td><td>'+totCnt+'</td><td>\u00a5'+Math.round(getRegWkATV())+'</td><td>'+getRegWkJD().toFixed(2)+'</td><td style="color:#16a34a;font-weight:700">'+(rConv.rate?rConv.rate.toFixed(2):'N/A')+'%</td><td>'+fmtAmt(totWos)+'</td><td>'+fmtAmt(totJl)+'</td><td>'+fmtAmt(totLt)+'</td><td>'+totLtQty+'\u4ef6</td><td>'+fmtAmt(sReg.wk_amt||0)+'</td><td>'+(sReg.wk_qty||0)+'\u4ef6</td><td style="color:'+(totAmt>0&&(totLt/totAmt*100)>=10?'#16a34a':'#dc2626')+'">'+(totAmt>0?(totLt/totAmt*100).toFixed(1):0)+'%</td></tr>';
  tHtml+='</tbody>';
  document.getElementById('cmpTable').innerHTML=tHtml;
  // 区域均值标红说明
  let cmpNote=document.getElementById('cmpTableNote');
  if(cmpNote) cmpNote.remove();
  cmpNote=document.createElement('div');
  cmpNote.id='cmpTableNote';
  cmpNote.style='margin-top:10px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:13px;color:#dc2626;font-weight:700';
  cmpNote.textContent='🔴 周累计/笔数/客单价/连带率/长尾占比 低于区域均值已标红（周累计¥'+Math.round(regWkAmtAvg)+'、笔数'+Math.round(regWkCntAvg)+'、客单价¥'+Math.round(regWkATV)+'、连带率'+regWkJD.toFixed(2)+'、长尾占比'+regWkLtPctAvg.toFixed(1)+'%）';
  document.getElementById('cmpTable').parentNode.appendChild(cmpNote);
  let _cmpConc=document.createElement('div');
  _cmpConc.style.cssText='margin-top:10px';
  const _below=STORE_ORDER.filter(s=>DATA[s].wk_amt<regWkAmtAvg);
  const _dual=STORE_ORDER.filter(s=>!isNA(DATA[s].wk_yoy)&&DATA[s].wk_yoy<0&&!isNA(DATA[s].wow)&&DATA[s].wow<0);
  const _topRate=STORE_ORDER.map(s=>{const d=DATA[s];const wt=d.daily.reduce((a,x)=>a+(x.target||0),0);return{s,rate:wt>0?d.wk_amt/wt*100:0};}).sort((a,b)=>b.rate-a.rate)[0];
  _cmpConc.innerHTML=conc('区域7店中'+_below.length+'家周累计低于区域均值（¥'+Math.round(regWkAmtAvg)+'）：'+(_below.length?_below.map(s=>s).join('、')+'。':'均超均值。')+_topRate.s+'完成率领先（'+_topRate.rate.toFixed(1)+'%）。',(_dual.length>0?(_dual.map(s=>s).join('、')+'同环比双降，是区域主要拖累，建议集中资源帮扶并复盘品类与客流。'):(_below.length===0?'各门店周累计与同环比表现均衡，区域整体健康。':'')));
  document.getElementById('cmpTable').parentNode.appendChild(_cmpConc);

  // All guides ranking chart (bar=周销售 + line=周环比)
  const allGuides=[];
  STORE_ORDER.forEach(s=>{((DATA['_guides']||{})[s]||[]).forEach(g=>allGuides.push(g));});
  allGuides.sort((a,b)=>b.wk_sales-a.wk_sales);
  if(allGuides.length>0){
    charts.cmpGuides=new Chart(document.getElementById('cmpGuides'),{
      data:{labels:allGuides.map(g=>g.name+'('+g.store+')'),datasets:[
        {type:'bar',label:'\u5468\u9500\u552e',data:allGuides.map(g=>g.wk_sales),backgroundColor:allGuides.map(g=>STORE_COLORS[g.store]+'cc'),borderColor:allGuides.map(g=>STORE_COLORS[g.store]),borderWidth:1,borderRadius:4,xAxisID:'x'},
        {type:'line',label:'\u5468\u73af\u6bd4',data:allGuides.map(g=>isNA(g.wow)?null:g.wow),borderColor:'#dc2626',backgroundColor:'transparent',borderWidth:2,pointRadius:5,pointBackgroundColor:allGuides.map(g=>isNA(g.wow)?'#94a3b8':(g.wow>=0?'#16a34a':'#dc2626')),tension:.3,xAxisID:'x1'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>{const g=allGuides[ctx.dataIndex];if(ctx.dataset.label.includes('\u5468\u9500'))return '\u5468\u9500\u552e: '+fmtAmt(g.wk_sales);return '\u5468\u73af\u6bd4: '+(isNA(g.wow)?'N/A':(g.wow>=0?'+':'')+g.wow.toFixed(1)+'%');}}}},
        scales:{x:{position:'bottom',title:{display:true,text:'\u5468\u9500\u552e(\u00a5)'},ticks:{callback:v=>fmtAmt(v)}},x1:{position:'top',title:{display:true,text:'\u5468\u73af\u6bd4(%)'},grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'}}}}
    });
  }
}

function selectStore(store){
  currentStore=store;
  document.querySelectorAll('.store-tab').forEach(t=>t.classList.toggle('active',t.dataset.store===store));
  if(store==='\u533a\u57df\u5bf9\u6bd4'){renderComparison();}
  else{renderStore(store);}
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
  selectStore(currentStore);
});
</script>
</body>
</html>
