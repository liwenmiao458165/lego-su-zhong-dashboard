:root{--bg:#f8fafc;--card-bg:#fff;--border:#e2e8f0;--text:#1e293b;--text-muted:#64748b;--red:#dc2626;--green:#16a34a;--blue:#0284c7;--orange:#ea580c;--purple:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text)}
.header{background:linear-gradient(135deg,#1e293b 0%,#334155 100%);color:#fff;padding:20px 30px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.header h1{font-size:22px;font-weight:700}
.header .subtitle{font-size:13px;opacity:.7;margin-top:4px}
.store-tabs{display:flex;gap:8px;padding:12px 30px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:64px;z-index:99}
.store-tab{padding:8px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;white-space:nowrap;border:2px solid var(--border);background:#fff;transition:all .2s}
.store-tab:hover{border-color:var(--purple)}
.store-tab.active{color:#fff;border-color:transparent}
.store-tab[data-store="扬州万象汇"].active{background:#7c3aed}
.store-tab[data-store="扬州京华城"].active{background:#0ea5e9}
.store-tab[data-store="扬州江都金鹰"].active{background:#059669}
.store-tab[data-store="泰州万象城"].active{background:#dc2626}
.store-tab[data-store="宿迁宝龙"].active{background:#ea580c}
.store-tab[data-store="淮安新亚"].active{background:#0891b2}
.store-tab[data-store="淮安万象城"].active{background:#9333ea}
.store-tab[data-store="区域对比"].active{background:#1e293b}
.container{max-width:1400px;margin:0 auto;padding:20px 30px}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:24px}
.kpi-card{background:var(--card-bg);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border);text-align:center}
.kpi-card .label{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.kpi-card .value{font-size:24px;font-weight:800}
.kpi-card .sub{font-size:11px;margin-top:4px}
.kpi-card .value.red{color:var(--red)}.kpi-card .value.green{color:var(--green)}.kpi-card .value.blue{color:var(--blue)}.kpi-card .value.orange{color:var(--orange)}.kpi-card .value.purple{color:var(--purple)}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
.chart-grid.full{grid-template-columns:1fr}
.chart-card{background:var(--card-bg);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--border)}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-card h3 .icon{font-size:18px}
.chart-wrap{position:relative;height:320px}
.chart-wrap.tall{height:380px}
.summary-table{width:100%;border-collapse:collapse;font-size:13px}
.summary-table th{background:#f1f5f9;padding:10px 12px;text-align:center;font-weight:700;border-bottom:2px solid var(--border)}
.summary-table td{padding:8px 12px;text-align:center;border-bottom:1px solid var(--border)}
.summary-table tr:hover{background:#f8fafc}
.summary-table .store-name{text-align:left;font-weight:600}
.summary-table .pos{color:var(--green);font-weight:700}.summary-table .neg{color:var(--red);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge.green{background:#dcfce7;color:#166534}.badge.red{background:#fee2e2;color:#991b1b}.badge.gray{background:#f1f5f9;color:#64748b}
.conclusion{font-size:13px;color:#475569;margin-top:10px;padding:0;background:#f8fafc;border-radius:6px;border-left:3px solid var(--purple);line-height:1.5;overflow:hidden}
.conc-title{padding:8px 12px 4px 12px;font-weight:700;color:#1e293b}
.conc-body{padding:0 12px 8px 12px}
.conc-opportunity{padding:6px 12px;background:#fef3c7;border-top:1px solid #f59e0b;font-size:12px;color:#92400e;line-height:1.6}
.conc-opportunity .conc-label{font-weight:700;color:#b45309}
.footer{text-align:center;padding:30px;color:var(--text-muted);font-size:12px}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr)}.chart-grid{grid-template-columns:1fr}}
</style>

function fmtAmt(v){if(v===null||v===undefined)return 'N/A';return '¥'+Math.round(v).toLocaleString()}
function fmtPct(v){if(v===null||v===undefined)return 'N/A';return v.toFixed(1)+'%'}
function colorPct(v){if(v===null||v===undefined)return '';return v>=0?'green':'red'}
function isNA(v){return v===null||v===undefined}
function getWeeklyCnt(s){if(typeof s==='string')s=DATA[s];return s.daily.reduce((a,x)=>a+x.tx_cnt,0)}
function getWeeklyATV(s){if(typeof s==='string')s=DATA[s];const c=getWeeklyCnt(s);return c>0?s.wk_amt/c:0}
function getWeeklyJD(s){if(typeof s==='string')s=DATA[s];const c=getWeeklyCnt(s);if(c===0)return 0;return s.daily.reduce((a,x)=>a+x.jd*x.tx_cnt,0)/c}
function getRegWkATV(){const t=STORE_ORDER.reduce((a,s)=>a+DATA[s].wk_amt,0);const c=STORE_ORDER.reduce((a,s)=>a+getWeeklyCnt(s),0);return c>0?t/c:0}
function getRegWkJD(){const c=STORE_ORDER.reduce((a,s)=>a+getWeeklyCnt(s),0);if(c===0)return 0;return STORE_ORDER.reduce((a,s)=>a+getWeeklyJD(s)*getWeeklyCnt(s),0)/c}
function regVal(fn){return STORE_ORDER.reduce((a,s)=>a+fn(DATA[s]),0)}

function concKPI(s){
  const d=DATA[s],r=DATA['_region'];
  const atv=getWeeklyATV(s),jd=getWeeklyJD(s),ratv=getRegWkATV(),rjd=getRegWkJD();
  const wpct=d.wk_amt>0?d.wk_wos/d.wk_amt*100:0,rwpct=regVal(x=>x.wk_wos)/(regVal(x=>x.wk_amt)||1)*100;
  const lpct=d.wk_amt>0?d.wk_lt/d.wk_amt*100:0,rlpct=regVal(x=>x.wk_lt)/(regVal(x=>x.wk_amt)||1)*100;
  const wt=d.daily.reduce((a,x)=>a+(x.target||0),0),rate=wt>0?d.wk_amt/wt*100:0;
  const rwt=regVal(x=>x.daily.reduce((a,day)=>a+(day.target||0),0)),rrate=rwt>0?regVal(x=>x.wk_amt)/rwt*100:0;
  const below=[];
  if(rate<rrate)below.push('周完成率'+rate.toFixed(1)+'%（区域'+rrate.toFixed(1)+'%，差'+(rrate-rate).toFixed(1)+'pct）');
  if(!isNA(d.wk_yoy)&&!isNA(r.wk_yoy)&&d.wk_yoy<r.wk_yoy)below.push('周同比'+d.wk_yoy.toFixed(1)+'%（区域'+r.wk_yoy.toFixed(1)+'%）');
  if(!isNA(d.wow)&&!isNA(r.wow)&&d.wow<r.wow)below.push('周环比'+d.wow.toFixed(1)+'%（区域'+r.wow.toFixed(1)+'%）');
  if(atv<ratv)below.push('客单价¥'+Math.round(atv)+'（区域¥'+Math.round(ratv)+'，差¥'+Math.round(ratv-atv)+'）');
  if(jd<rjd)below.push('连带率'+jd.toFixed(2)+'（区域'+rjd.toFixed(2)+'，差'+(rjd-jd).toFixed(2)+'）');
  if(wpct<rwpct)below.push('WOS占比'+wpct.toFixed(1)+'%（区域'+rwpct.toFixed(1)+'%）');
  if(lpct<rlpct)below.push('长尾款占比'+lpct.toFixed(1)+'%（区域'+rlpct.toFixed(1)+'%）');
  const c=s+'KPI汇总：周销售'+fmtAmt(d.wk_amt)+'，完成率'+rate.toFixed(1)+'%，连带率'+jd.toFixed(2)+'，客单价¥'+Math.round(atv)+'。';
  let o='';
  if(below.length>0)o='低于区域整体的KPI：'+below.join('；')+'。需逐项分析差距原因，制定提升计划。';
  else o='各项KPI均达到或优于区域整体水平，保持当前运营策略。';
  return conc(c,o);
}

    const wb=isNA(d.wow)?'<span class="badge gray">N/A</span>':(d.wow>=0?'<span class="badge green">+'+d.wow.toFixed(1)+'%</span>':'<span class="badge red">'+d.wow.toFixed(1)+'%</span>');

    tHtml+='<tr><td class="store-name" style="color:'+STORE_COLORS[s]+'">'+s+'</td><td style="font-weight:700'+(d.wk_amt<regWkAmtAvg?';color:#dc2626':'')+'">'+fmtAmt(d.wk_amt)+'</td><td>'+wb+'</td><td>'+yb+'</td><td'+(cnt<regWkCntAvg?' style="color:#dc2626;font-weight:700"':'')+'>'+cnt+'</td><td'+(atv<regWkATV?' style="color:#dc2626;font-weight:700"':'')+'>¥'+Math.round(atv)+'</td><td'+(jd<regWkJD?' style="color:#dc2626;font-weight:700"':'')+'>'+jd.toFixed(2)+'</td><td style="color:'+((wcvo[s]&&wcvo[s].flow>0&&wcvo[s].rate>=rConv.rate)?'#16a34a':'#dc2626')+';font-weight:700">'+((wcvo[s]&&wcvo[s].flow>0)?wcvo[s].rate.toFixed(2)+'%':'缺客流')+'</td><td>'+fmtAmt(d.wk_wos)+'</td><td>'+fmtAmt(d.wk_jl)+'</td><td>'+fmtAmt(d.wk_lt)+'</td><td style="color:'+(mxPct<regWkMxPctAvg?'#dc2626':'#16a34a')+';font-weight:700">'+fmtAmt(mxAmt)+'</td><td style="color:'+(xcPct<regWkXcPctAvg?'#dc2626':'#16a34a')+';font-weight:700">'+fmtAmt(xcAmt)+'</td><td>'+fmtAmt(npAmt)+'</td></tr>';
  });
  // Totals row
  tHtml+='<tr style="background:#7c3aed10;font-weight:700"><td class="store-name">\u533a\u57df\u5408\u8ba1</td><td>'+fmtAmt(totAmt)+'</td><td>'+(isNA(r.wow)?'<span class="badge gray">N/A</span>':(r.wow>=0?'<span class="badge green">+'+r.wow.toFixed(1)+'%</span>':'<span class="badge red">'+r.wow.toFixed(1)+'%</span>'))+'</td><td>'+(isNA(regYoy)?'<span class="badge gray">N/A</span>':(regYoy>=0?'<span class="badge green">+'+regYoy.toFixed(1)+'%</span>':'<span class="badge red">'+regYoy.toFixed(1)+'%</span>'))+'</td><td>'+totCnt+'</td><td>\u00a5'+Math.round(getRegWkATV())+'</td><td>'+getRegWkJD().toFixed(2)+'</td><td style="color:#16a34a;font-weight:700">'+(rConv.rate===null?'N/A':rConv.rate.toFixed(2)+'%')+'%</td><td>'+fmtAmt(totWos)+'</td><td>'+fmtAmt(totJl)+'</td><td>'+fmtAmt(totLt)+'</td><td>'+fmtAmt(r.wk_mx_amt||0)+'</td><td>'+fmtAmt(r.wk_xc_amt||0)+'</td><td>'+fmtAmt(npRegAmt)+'</td></tr>';
  tHtml+='</tbody>';
  document.getElementById('cmpTable').innerHTML=tHtml;
  // 区域均值标红说明
  let cmpNote=document.getElementById('cmpTableNote');
  if(cmpNote) cmpNote.remove();
  cmpNote=document.createElement('div');
  cmpNote.id='cmpTableNote';
  cmpNote.style='margin-top:10px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;font-size:13px;color:#dc2626;font-weight:700';
  cmpNote.textContent='🔴 周累计/笔数/客单价/连带率 低于区域均值已标红（周累计¥'+Math.round(regWkAmtAvg)+'、笔数'+Math.round(regWkCntAvg)+'、客单价¥'+Math.round(regWkATV)+'、连带率'+regWkJD.toFixed(2)+'）；明星同款：参考区域均值；样品未开单标红；长尾款自 2026-10-10 起仅统计销售额，无目标/完成率；2026-10-13 起秋季特惠活动已结束，模块移除';
  document.getElementById('cmpTable').parentNode.appendChild(cmpNote);
  let _cmpConc=document.createElement('div');
  _cmpConc.style.cssText='margin-top:10px';
  const _below=STORE_ORDER.filter(s=>DATA[s].wk_amt<regWkAmtAvg);
  const _dual=STORE_ORDER.filter(s=>!isNA(DATA[s].wk_yoy)&&DATA[s].wk_yoy<0&&!isNA(DATA[s].wow)&&DATA[s].wow<0);
  const _topRate=STORE_ORDER.map(s=>{const d=DATA[s];const wt=d.daily.reduce((a,x)=>a+(x.target||0),0);return{s,rate:wt>0?d.wk_amt/wt*100:0};}).sort((a,b)=>b.rate-a.rate)[0];
  _cmpConc.innerHTML=conc('区域7店中'+_below.length+'家周累计低于区域均值（¥'+Math.round(regWkAmtAvg)+'）：'+(_below.length?_below.map(s=>s).join('、')+'。':'均超均值。')+_topRate.s+'完成率领先（'+_topRate.rate.toFixed(1)+'%）。',(_dual.length>0?(_dual.map(s=>s).join('、')+'同环比双降，是区域主要拖累，建议集中资源帮扶并复盘品类与客流。'):(_below.length===0?'各门店周累计与同环比表现均衡，区域整体健康。':'')));
  document.getElementById('cmpTable').parentNode.appendChild(_cmpConc);

  // All guides ranking chart (bar=周销售 + line=周环比)
  const allGuides=[];
  STORE_ORDER.forEach(s=>{((DATA['_guides']||{})[s]||[]).forEach(g=>allGuides.push(g));});
  allGuides.sort((a,b)=>b.wk_sales-a.wk_sales);
  if(allGuides.length>0){
    charts.cmpGuides=new Chart(document.getElementById('cmpGuides'),{
      data:{labels:allGuides.map(g=>g.name+'('+g.store+')'),datasets:[
        {type:'bar',label:'\u5468\u9500\u552e',data:allGuides.map(g=>g.wk_sales),backgroundColor:allGuides.map(g=>STORE_COLORS[g.store]+'cc'),borderColor:allGuides.map(g=>STORE_COLORS[g.store]),borderWidth:1,borderRadius:4,xAxisID:'x'},
        {type:'line',label:'\u5468\u73af\u6bd4',data:allGuides.map(g=>isNA(g.wow)?null:g.wow),borderColor:'#dc2626',backgroundColor:'transparent',borderWidth:2,pointRadius:5,pointBackgroundColor:allGuides.map(g=>isNA(g.wow)?'#94a3b8':(g.wow>=0?'#16a34a':'#dc2626')),tension:.3,xAxisID:'x1'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
        plugins:{legend:{position:'top'},tooltip:{callbacks:{label:ctx=>{const g=allGuides[ctx.dataIndex];if(ctx.dataset.label.includes('\u5468\u9500'))return '\u5468\u9500\u552e: '+fmtAmt(g.wk_sales);return '\u5468\u73af\u6bd4: '+(isNA(g.wow)?'N/A':(g.wow>=0?'+':'')+g.wow.toFixed(1)+'%');}}}},
        scales:{x:{position:'bottom',title:{display:true,text:'\u5468\u9500\u552e(\u00a5)'},ticks:{callback:v=>fmtAmt(v)}},x1:{position:'top',title:{display:true,text:'\u5468\u73af\u6bd4(%)'},grid:{drawOnChartArea:false},ticks:{callback:v=>v+'%'}}}}
    });
  }
}

function selectStore(store){
  currentStore=store;
  document.querySelectorAll('.store-tab').forEach(t=>t.classList.toggle('active',t.dataset.store===store));
  if(store==='\u533a\u57df\u5bf9\u6bd4'){renderComparison();}
  else{renderStore(store);}
}

document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('genTime').textContent=new Date().toLocaleString('zh-CN');
  selectStore(currentStore);
});
</script>
</body>
</html>
